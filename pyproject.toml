[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "decky"
version = "0.1.0"
description = "Personal workflow CLI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "tomli-w>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "mcp>=2.3",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
decky = "decky.cli:main"

[project.urls]
Homepage = "https://github.com/camaragon/decky"

[tool.hatch.build.targets.wheel]
artifacts = ["src/decky/server/static/**"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
