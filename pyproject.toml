[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "decky"
version = "0.1.0"
description = "Personal workflow CLI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
decky = "decky.cli:main"

[project.urls]
Homepage = "https://github.com/camaragon/decky"

[tool.pytest.ini_options]
testpaths = ["tests"]
