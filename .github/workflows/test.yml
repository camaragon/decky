name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[test]'
      - run: pytest
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: corepack enable
      - run: pnpm -C web install
      - run: pnpm -C web test
      - run: pnpm -C web typecheck
      - run: pnpm -C web build
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: corepack enable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install hatchling pytest httpx
      - run: pip install hatch
      - run: hatch build
      - run: pip install dist/decky-*.whl --force-reinstall
      - run: pytest tests/test_wheel_packaging.py
